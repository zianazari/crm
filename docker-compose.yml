# Local development services only. Credentials here are throwaway dev values;
# staging and production use separate, secret-managed credentials.
name: crm

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      - "127.0.0.1:${CRM_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crm -d crm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${CRM_REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: crm
      RABBITMQ_DEFAULT_PASS: crm
    ports:
      - "127.0.0.1:${CRM_RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${CRM_RABBITMQ_UI_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Catches every email sent in development: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:${CRM_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${CRM_MAILPIT_UI_PORT:-8025}:8025"

  # Simulated SMS provider (tools/sms-sink): http://localhost:8030
  sms-sink:
    build: ./tools/sms-sink
    environment:
      SMS_SINK_WEBHOOK_SECRET: dev-only-sms-webhook-secret
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${CRM_SMS_SINK_PORT:-8030}:8030"

volumes:
  postgres-data:
